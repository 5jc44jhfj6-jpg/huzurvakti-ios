workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Huzur Vakti
    environment:
      ios_signing:
        provisioning_profiles:
          - huzurvakti_appstore_19
          - namazdostu_widget_appstore
        certificates:
          - HuzurVakti
      xcode: latest
      cocoapods: default
    scripts:
      - name: Widget uzantisi (Namaz Dostu 1.9)
        script: |
          set -e
          A="NamazDostuWidget/Assets.xcassets"
          mkdir -p "$A"
          echo '{"info":{"author":"xcode","version":1}}' > "$A/Contents.json"
          for ad in vakit_safak vakit_sabah vakit_ogle vakit_ikindi vakit_aksam vakit_gece; do
            mkdir -p "$A/$ad.imageset"
            curl -fsSL --retry 3 "https://5jc44jhfj6-jpg.github.io/huzurvakti/img/$ad.jpg" -o "$A/$ad.imageset/$ad.jpg"
            sips -Z 640 "$A/$ad.imageset/$ad.jpg" >/dev/null
            echo "{\"images\":[{\"idiom\":\"universal\",\"filename\":\"$ad.jpg\"}],\"info\":{\"author\":\"xcode\",\"version\":1}}" > "$A/$ad.imageset/Contents.json"
          done
          gem list -i xcodeproj >/dev/null 2>&1 || gem install xcodeproj --no-document
          ruby widget_ekle.rb
      - name: Install CocoaPods
        script: |
          pod install --repo-update
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace "Huzur Vakti.xcworkspace" \
            --scheme "Huzur Vakti" || (cat /tmp/xcodebuild_logs/*.log && exit 1)
      - name: Widget kontrol (IPA icerigi)
        script: |
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          echo "IPA: $IPA"
          unzip -l "$IPA" | grep -i -E "PlugIns|appex" | head -40 || echo "!!! WIDGET UZANTISI IPA ICINDE YOK !!!"
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa && unzip -q "$IPA" -d /tmp/ipa
          APPEX=$(find /tmp/ipa -name "*.appex" | head -1)
          echo "APPEX: $APPEX"
          if [ -n "$APPEX" ]; then
            plutil -p "$APPEX/Info.plist" || true
            codesign -d --entitlements :- "$APPEX" 2>/dev/null || true
            codesign -d --entitlements :- /tmp/ipa/Payload/*.app 2>/dev/null | head -60 || true
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - "**/*.ipa"
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
